name: Build FCC data

on:
  schedule:
    # The FCC refreshes its "complete" ULS/ASR files weekly (Sunday night).
    - cron: "0 10 * * 2"   # Tuesdays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build tiles
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          TAG="data-$(date -u +%Y-%m-%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python build_db.py --raw raw --work work --out out --version "$DATE" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$TAG/"

      - name: Unit tests
        run: python -m unittest test_dof test_contacts

      - name: Sanity check
        run: python check_output.py out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload everything to a draft first, then publish, so the app's
          # releases/latest/download/manifest.json only ever points at a
          # complete set of files. Uploads go in small batches with retries:
          # GitHub's secondary rate limit rejects a burst of hundreds of uploads.
          upload() {
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$TAG" --clobber "$@"; then return 0; fi
              echo "upload failed (attempt $attempt); waiting before retry"
              sleep $((attempt * 45))
            done
            return 1
          }
          gh release create "$TAG" --draft --title "FCC data $TAG" \
            --notes "Weekly Tower Scan data build. FCC tiles: US government public data. See DATA-LICENSES.md."
          files=(out/*.sqlz)
          for ((i = 0; i < ${#files[@]}; i += 25)); do
            upload "${files[@]:i:25}"
            sleep 4
          done
          upload out/manifest.json
          gh release edit "$TAG" --draft=false --latest

      - name: Publish to Cloudflare R2
        # Same build, served from data.freshcoastrf.com. Tiles go to builds/<tag>/;
        # latest/manifest.json is written last so the app never sees a partial set.
        # GitHub Releases above stay as the source for older app versions.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: tower-scan-data
          R2_PUBLIC: https://data.freshcoastrf.com
        run: |
          # Trim stray spaces/newlines from the pasted secret and check it looks like an account ID.
          ACCT="$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '[:space:]')"
          if ! [[ "$ACCT" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID should be the 32-character hex Account ID (got ${#ACCT} characters)"; exit 1
          fi
          R2_ENDPOINT="https://$ACCT.r2.cloudflarestorage.com"
          mkdir -p r2
          python - <<'EOF'
          import json, os
          m = json.load(open("out/manifest.json"))
          m["baseURL"] = f"{os.environ['R2_PUBLIC']}/builds/{os.environ['TAG']}/"
          json.dump(m, open("r2/manifest.json", "w"), separators=(",", ":"))
          EOF
          aws s3 cp out/ "s3://$R2_BUCKET/builds/$TAG/" --recursive --exclude "*" --include "*.sqlz" \
            --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp r2/manifest.json "s3://$R2_BUCKET/builds/$TAG/manifest.json" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp r2/manifest.json "s3://$R2_BUCKET/latest/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=300" --content-type application/json

      - name: Prune old R2 builds (keep 3)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: tower-scan-data
        run: |
          R2_ENDPOINT="https://$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '[:space:]').r2.cloudflarestorage.com"
          aws s3 ls "s3://$R2_BUCKET/builds/" --endpoint-url "$R2_ENDPOINT" |
            awk '{print $2}' | sed 's#/$##' | sort | head -n -3 |
          while read -r tag; do
            aws s3 rm "s3://$R2_BUCKET/builds/$tag/" --recursive --endpoint-url "$R2_ENDPOINT"
          done

      - name: Prune old releases (keep 3)
        # Housekeeping only: GitHub sometimes answers 502 when deleting a release
        # with hundreds of files. That must not mark a successful publish as failed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt,isDraft \
            -q 'sort_by(.createdAt) | reverse | .[] | select(.isDraft or true) | .tagName' | tail -n +4 |
          while read -r tag; do
            for attempt in 1 2 3; do
              gh release delete "$tag" --yes --cleanup-tag && break
              sleep $((attempt * 20))
            done
          done
