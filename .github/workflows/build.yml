name: Build FCC data

on:
  schedule:
    # The FCC refreshes its "complete" ULS/ASR files weekly (Sunday night).
    - cron: "0 10 * * 2"   # Tuesdays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build tiles
        env:
          # Optional. Without it the FCC data still builds; the OpenCellID
          # carrier layer is skipped (see cells.py). Never echoed.
          OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          TAG="data-$(date -u +%Y-%m-%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python build_db.py --raw raw --work work --out out --version "$DATE" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$TAG/"

      - name: Unit tests
        run: python -m unittest test_cells

      - name: Sanity check
        run: python check_output.py out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload everything to a draft first, then publish, so the app's
          # releases/latest/download/manifest.json only ever points at a
          # complete set of files. Uploads go in small batches with retries:
          # GitHub's secondary rate limit rejects a burst of hundreds of uploads.
          upload() {
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$TAG" --clobber "$@"; then return 0; fi
              echo "upload failed (attempt $attempt); waiting before retry"
              sleep $((attempt * 45))
            done
            return 1
          }
          gh release create "$TAG" --draft --title "FCC data $TAG" \
            --notes "Weekly Tower Scan data build. FCC tiles: US government public data. cells.sqlz (if present): derived from OpenCellID, CC BY-SA 4.0. See DATA-LICENSES.md."
          files=(out/*.sqlz)
          for ((i = 0; i < ${#files[@]}; i += 25)); do
            upload "${files[@]:i:25}"
            sleep 4
          done
          upload out/manifest.json
          gh release edit "$TAG" --draft=false --latest

      - name: Prune old releases (keep 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
